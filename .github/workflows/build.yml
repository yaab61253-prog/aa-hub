name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Init Capacitor
        run: |
          npx cap init "AA Hub" "com.nebulaspectrastudio.aahub" --web-dir www
          mkdir -p www
          echo '<script>window.location.href="https://aa-hub.netlify.app"</script>' > www/index.html
          npx cap add android
          npx cap sync

      - name: Copy Icon
        run: |
          sudo apt-get install -y imagemagick
          for size in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            folder=${size%:*}
            px=${size#*:}
            mkdir -p android/app/src/main/res/mipmap-$folder
            convert -resize ${px}x${px} icon.png android/app/src/main/res/mipmap-$folder/ic_launcher.png
            cp android/app/src/main/res/mipmap-$folder/ic_launcher.png android/app/src/main/res/mipmap-$folder/ic_launcher_round.png
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aa-hub-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
