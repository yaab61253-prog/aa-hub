name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Init Capacitor
        run: |
          npx cap init "AA Hub" "com.nebulaspectrastudio.aahub" --web-dir www
          mkdir -p www
          echo '<script>window.location.href="https://aa-hub.netlify.app"</script>' > www/index.html
          npx cap add android
          npx cap sync
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aa-hub-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
