<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AA Hub about</title>
<meta name="description" content="تعرف على AA Hub، منصة التواصل الاجتماعي السريعة من NebulaSpectra Studio.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://aa-hub.netlify.app/about/">
<link rel="icon" href="/images/android-icon.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="about.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<body>
<header class="site-header">
  <a href="/" class="back-btn"><i data-lucide="arrow-right" style="width:18px;height:18px;"></i></a>
  <span class="hdr-title" id="hdr-title"></span>
</header>
<div class="hero">
  <h1>AA Hub</h1>
  <p id="hero-p"></p>
</div>
<div class="content">
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num">30+</div><div class="stat-lbl" id="stat-users"></div></div>

    <div class="stat-card"><div class="stat-num">2025</div><div class="stat-lbl" id="stat-founded"></div></div>
  </div>
  <div class="page-card">
    <div class="card-icon"><i data-lucide="sparkles" style="width:22px;height:22px;"></i></div>
    <div class="card-title" id="what-title"></div>
    <div class="card-text" id="what-text"></div>
  </div>
  <div class="page-card">
    <div class="card-icon"><i data-lucide="target" style="width:22px;height:22px;"></i></div>
    <div class="card-title" id="mission-title"></div>
    <div class="card-text" id="mission-text"></div>
  </div>
  <div class="page-card">
    <div class="card-icon"><i data-lucide="heart" style="width:22px;height:22px;"></i></div>
    <div class="card-title" id="values-title"></div>
    <div class="card-text" id="values-text"></div>
  </div>
</div>
<footer class="pg-footer">AA Hub © 2026 NebulaSpectra Studio · <a href="/privacy" id="footer-privacy"></a> · <a href="/terms" id="footer-terms"></a></footer>

</html>
