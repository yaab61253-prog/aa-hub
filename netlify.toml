[build]
  publish = "."
  ignore  = "exit 0"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from   = "/index.html"
  to     = "/"
  status = 301
  force  = true

[[redirects]]
  from   = "/about/index.html"
  to     = "/about/"
  status = 301
  force  = true

[[redirects]]
  from   = "/contact/index.html"
  to     = "/contact/"
  status = 301
  force  = true

[[redirects]]
  from   = "/privacy/index.html"
  to     = "/privacy/"
  status = 301
  force  = true

[[redirects]]
  from   = "/terms/index.html"
  to     = "/terms/"
  status = 301
  force  = true

[[redirects]]
  from   = "/support/index.html"
  to     = "/support/"
  status = 301
  force  = true

[[redirects]]
  from   = "/action/index.html"
  to     = "/action/"
  status = 301
  force  = true

[[redirects]]
  from   = "http://aa-hub.netlify.app/*"
  to     = "https://aa-hub.netlify.app/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.aa-hub.netlify.app/*"
  to     = "https://aa-hub.netlify.app/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control    = "on"
    X-Download-Options        = "noopen"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://aa-hub.netlify.app https://nebulaspectrastudio.netlify.app https://via.placeholder.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com https://api.groq.com wss://*.firebaseio.com; media-src 'self' blob: https://firebasestorage.googleapis.com; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Cache-Control           = "no-cache, no-store, must-revalidate"
    Pragma                  = "no-cache"
    Expires                 = "0"

[[headers]]
  for = "/about/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Cache-Control           = "no-cache, no-store, must-revalidate"
    Pragma                  = "no-cache"

[[headers]]
  for = "/contact/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Cache-Control           = "no-cache, no-store, must-revalidate"
    Pragma                  = "no-cache"

[[headers]]
  for = "/privacy/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Cache-Control           = "no-cache, no-store, must-revalidate"
    Pragma                  = "no-cache"

[[headers]]
  for = "/terms/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Cache-Control           = "no-cache, no-store, must-revalidate"
    Pragma                  = "no-cache"

[[headers]]
  for = "/support/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Cache-Control           = "no-cache, no-store, must-revalidate"
    Pragma                  = "no-cache"

[[headers]]
  for = "/action/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests;"
    Cache-Control           = "no-cache, no-store, must-revalidate"
    Pragma                  = "no-cache"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/about/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/contact/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/privacy/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
